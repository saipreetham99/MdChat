<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Preview</title>
<link rel="stylesheet" href="vendor/codemirror.css">
<link rel="stylesheet" href="vendor/cm-dialog.css">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #6e6e73;
    --rule: #e3e3e6;
    --code-bg: #f5f5f7;
    --accent: #0a63c9;
    --pick-bg: rgba(255,255,255,.92);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --fg: #e6e6e6;
      --muted: #9a9a9e;
      --rule: #3a3a3c;
      --code-bg: #262628;
      --accent: #6aa9ff;
      --pick-bg: rgba(40,40,42,.94);
    }
  }

  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 28px 32px 60vh;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #doc { max-width: none; }

  h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.9em 0 .6em; font-weight: 600; }
  h1 { font-size: 1.9em; margin-top: .2em; letter-spacing: -.015em; }
  h2 { font-size: 1.45em; padding-bottom: .25em; border-bottom: 1px solid var(--rule); }
  h3 { font-size: 1.18em; }
  h4, h5, h6 { font-size: 1em; }
  p, ul, ol, blockquote, table, pre { margin: 0 0 1em; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul, ol { padding-left: 1.5em; }
  li { margin: .25em 0; }
  blockquote {
    padding: .1em 0 .1em 1em;
    border-left: 3px solid var(--rule);
    color: var(--muted);
  }
  hr { border: none; border-top: 1px solid var(--rule); margin: 2em 0; }
  code, pre, .mermaid {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  code { font-size: .88em; background: var(--code-bg); padding: .15em .35em; border-radius: 4px; }
  pre {
    background: var(--code-bg);
    padding: 12px 14px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: .86em;
    line-height: 1.5;
  }
  pre code { background: none; padding: 0; font-size: 1em; }
  table { border-collapse: collapse; font-size: .94em; }
  th, td { border: 1px solid var(--rule); padding: .4em .7em; text-align: left; }
  th { background: var(--code-bg); font-weight: 600; }
  img { max-width: 100%; border-radius: 6px; }
  .mermaid { background: var(--code-bg); border-radius: 8px; padding: 12px; text-align: center; }
  .mermaid svg { max-width: 100%; height: auto; }

  /* context pickers */
  .picker {
    position: absolute;
    display: none;
    gap: 4px;
    z-index: 20;
    background: var(--pick-bg);
    backdrop-filter: blur(8px);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 3px;
    box-shadow: 0 2px 8px rgba(0,0,0,.14);
  }
  .picker.on { display: flex; }
  .picker button {
    font: 500 11px/1 -apple-system, system-ui, sans-serif;
    color: var(--fg);
    background: none;
    border: 0;
    border-radius: 5px;
    padding: 5px 8px;
    cursor: default;
    white-space: nowrap;
  }
  .picker button:hover { background: var(--accent); color: #fff; }
  .picker button[hidden] { display: none; }
  /* vim caret + chrome */
  #caret {
    position: absolute;
    display: none;
    width: 2px;
    background: var(--accent);
    z-index: 15;
    pointer-events: none;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }
  #doc ::selection, #doc::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }

  #badge, #searchBar {
    position: fixed;
    bottom: 10px;
    font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--pick-bg);
    backdrop-filter: blur(8px);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 6px 9px;
    z-index: 30;
    color: var(--muted);
  }
  #badge { right: 10px; display: none; }
  #badge.on { display: block; }
  #badge b { color: var(--accent); font-weight: 600; }

  #searchBar { left: 10px; display: none; align-items: center; gap: 4px; }
  #searchBar.on { display: flex; }
  #searchInput {
    font: inherit;
    color: var(--fg);
    background: none;
    border: 0;
    outline: none;
    width: 26ch;
    padding: 0;
  }

  /* editor */
  body.editing { padding: 0; }
  #editor { display: none; }
  body.editing #editor { display: block; }
  body.editing #doc { display: none; }

  .CodeMirror {
    height: 100vh;
    font: 13px/1.65 ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--bg);
    color: var(--fg);
  }
  .CodeMirror-gutters { background: var(--bg); border-right: 1px solid var(--rule); }
  .CodeMirror-linenumber { color: var(--muted); }
  .CodeMirror-cursor { border-left: 2px solid var(--accent); }
  .cm-fat-cursor .CodeMirror-cursor,
  .CodeMirror-cursor.CodeMirror-overwrite { background: var(--accent); opacity: .55; }
  .CodeMirror-selected { background: var(--rule); }
  .CodeMirror-focused .CodeMirror-selected { background: var(--accent); opacity: .3; }
  .CodeMirror-activeline-background { background: var(--code-bg); }
  .CodeMirror-matchingbracket { color: var(--accent) !important; font-weight: 600; }

  .cm-s-default .cm-header { color: var(--accent); font-weight: 600; }
  .cm-s-default .cm-quote { color: var(--muted); }
  .cm-s-default .cm-link { color: var(--accent); }
  .cm-s-default .cm-url { color: var(--muted); }
  .cm-s-default .cm-comment { color: var(--muted); }
  .cm-s-default .cm-string { color: var(--accent); }
  .cm-s-default .cm-variable-2, .cm-s-default .cm-variable-3 { color: var(--fg); }
  .cm-s-default .cm-keyword { color: var(--accent); }
  .cm-strong { font-weight: 700; }
  .cm-em { font-style: italic; }

  .CodeMirror-dialog {
    background: var(--pick-bg);
    color: var(--fg);
    border-bottom: 1px solid var(--rule);
    font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
  }
  .CodeMirror-dialog input {
    font: inherit;
    color: var(--fg);
    background: none;
    border: 0;
    outline: none;
  }

  /* flash-style jump overlay */
  #jumpLayer {
    position: absolute;
    top: 0;
    left: 0;
    display: none;
    z-index: 25;
    pointer-events: none;
  }
  #jumpLayer.on { display: block; }
  .jump-hl {
    position: absolute;
    background: var(--accent);
    opacity: .26;
    border-radius: 2px;
  }
  .jump-label {
    position: absolute;
    font: 700 11px/1.3 ui-monospace, "SF Mono", Menlo, monospace;
    color: #fff;
    background: var(--accent);
    border-radius: 3px;
    padding: 1px 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .jump-label.dim { background: var(--muted); }

  .flash { animation: flash .45s ease-out; }
  @keyframes flash {
    from { background: color-mix(in srgb, var(--accent) 22%, transparent); }
    to { background: transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>
</head>
<body>
  <div id="doc"></div>
  <div id="editor"></div>

  <div class="picker" id="hoverPicker">
    <button data-act="block">Ask</button>
    <button data-act="section" hidden>Whole section</button>
  </div>
  <div class="picker" id="selPicker">
    <button data-act="selection">Ask about selection</button>
  </div>

  <div id="jumpLayer"></div>
  <div id="caret"></div>
  <div id="badge"></div>
  <div id="searchBar"><span>/</span><input id="searchInput" spellcheck="false" autocomplete="off"></div>

<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script src="vendor/codemirror.js"></script>
<script src="vendor/cm-xml.js"></script>
<script src="vendor/cm-markdown.js"></script>
<script src="vendor/cm-dialog.js"></script>
<script src="vendor/cm-vim.js"></script>
<script>
(function () {
  "use strict";

  var doc = document.getElementById("doc");
  var hoverPicker = document.getElementById("hoverPicker");
  var selPicker = document.getElementById("selPicker");

  var SRC = "";
  var LINES = [];
  var hoverTarget = null;
  var dark = window.matchMedia("(prefers-color-scheme: dark)");

  function post(kind, text) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge) {
      window.webkit.messageHandlers.bridge.postMessage({ kind: kind, text: text || "" });
    }
  }

  function sendContext(text) {
    if (text && text.trim()) post("context", text);
  }

  // --- markdown-it with source line mapping ------------------------------
  var md = window.markdownit({ html: true, linkify: true, typographer: false });

  md.core.ruler.push("source_lines", function (state) {
    state.tokens.forEach(function (t) {
      if (t.level === 0 && t.map) {
        t.attrSet("data-line-start", String(t.map[0]));
        t.attrSet("data-line-end", String(t.map[1]));
      }
    });
  });

  var defaultFence = md.renderer.rules.fence;
  md.renderer.rules.fence = function (tokens, idx, options, env, self) {
    var t = tokens[idx];
    var lang = (t.info || "").trim().split(/\s+/)[0];
    if (lang === "mermaid") {
      var a = t.attrGet("data-line-start") || "0";
      var b = t.attrGet("data-line-end") || "0";
      var body = t.content
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return '<div class="mermaid" data-line-start="' + a + '" data-line-end="' + b + '">' + body + "</div>";
    }
    return defaultFence(tokens, idx, options, env, self);
  };

  function initMermaid() {
    if (!window.mermaid) return;
    window.mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: dark.matches ? "dark" : "default",
      fontFamily: 'ui-monospace, "SF Mono", Menlo, monospace'
    });
  }
  initMermaid();
  dark.addEventListener("change", function () {
    initMermaid();
    render(SRC);
  });

  function renderPreview() {
    hidePickers();
    var y = window.scrollY;
    doc.innerHTML = md.render(SRC);
    window.scrollTo(0, y);
    var nodes = Array.prototype.slice.call(doc.querySelectorAll(".mermaid"));
    if (nodes.length && window.mermaid) {
      window.mermaid.run({ nodes: nodes }).catch(function (e) {
        console.warn("mermaid:", e);
      });
    }
    previewStale = false;
    resetVim();
  }

  // Called from Swift whenever the document text changes on its side.
  window.render = function (text) {
    SRC = text || "";
    LINES = SRC.split("\n");
    if (cm && cm.getValue() !== SRC) {
      var cursor = cm.getCursor();
      cm.setValue(SRC);
      cm.setCursor(cursor);
    }
    if (view === "edit") { previewStale = true; return; }
    renderPreview();
  };

  // --- source slicing ----------------------------------------------------
  function slice(start, end) {
    if (start == null) return "";
    return LINES.slice(start, end).join("\n").replace(/\s+$/, "");
  }

  function blockSource(el) {
    return slice(parseInt(el.getAttribute("data-line-start"), 10),
                 parseInt(el.getAttribute("data-line-end"), 10));
  }

  function headingLevel(el) {
    return /^H[1-6]$/.test(el.tagName) ? parseInt(el.tagName[1], 10) : 0;
  }

  /** Everything from this heading down to the next heading of same or higher rank. */
  function sectionSource(el) {
    var level = headingLevel(el);
    if (!level) return blockSource(el);
    var start = parseInt(el.getAttribute("data-line-start"), 10);
    var all = Array.prototype.slice.call(doc.querySelectorAll("h1,h2,h3,h4,h5,h6"));
    var end = LINES.length;
    for (var i = 0; i < all.length; i++) {
      var h = all[i];
      var hs = parseInt(h.getAttribute("data-line-start"), 10);
      if (isNaN(hs) || hs <= start) continue;
      if (headingLevel(h) <= level) { end = hs; break; }
    }
    return slice(start, end);
  }

  function flash(el) {
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
  }

  // --- hover picker ------------------------------------------------------
  function place(picker, rect, alignRight) {
    picker.classList.add("on");
    var w = picker.offsetWidth;
    var left = alignRight
      ? rect.right + window.scrollX - w
      : rect.left + window.scrollX;
    left = Math.max(8, Math.min(left, document.documentElement.clientWidth - w - 8));
    picker.style.left = left + "px";
    picker.style.top = Math.max(2, rect.top + window.scrollY - picker.offsetHeight - 4) + "px";
  }

  function hidePickers() {
    hoverPicker.classList.remove("on");
    selPicker.classList.remove("on");
    hoverTarget = null;
  }

  var queued = false;
  document.addEventListener("mousemove", function (e) {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () {
      queued = false;
      if (view === "edit") return;
      if (e.target.closest && e.target.closest(".picker")) return;
      var block = e.target.closest ? e.target.closest("#doc [data-line-start]") : null;
      if (!block) {
        hoverPicker.classList.remove("on");
        hoverTarget = null;
        return;
      }
      if (block === hoverTarget) return;
      hoverTarget = block;
      hoverPicker.querySelector('[data-act="section"]').hidden = !headingLevel(block);
      place(hoverPicker, block.getBoundingClientRect(), true);
    });
  });

  hoverPicker.addEventListener("mousedown", function (e) { e.preventDefault(); });
  hoverPicker.addEventListener("click", function (e) {
    var act = e.target.getAttribute("data-act");
    if (!act || !hoverTarget) return;
    sendContext(act === "section" ? sectionSource(hoverTarget) : blockSource(hoverTarget));
    flash(hoverTarget);
    hoverPicker.classList.remove("on");
  });

  // --- selection picker --------------------------------------------------
  function selectionText() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
    if (!doc.contains(sel.anchorNode)) return null;
    var text = sel.toString().trim();
    return text ? text : null;
  }

  document.addEventListener("selectionchange", function () {
    if (view === "edit") { selPicker.classList.remove("on"); return; }
    if (mode !== "normal" || programmatic) { selPicker.classList.remove("on"); return; }
    var text = selectionText();
    if (!text) { selPicker.classList.remove("on"); return; }
    var rect = window.getSelection().getRangeAt(0).getBoundingClientRect();
    if (!rect || (!rect.width && !rect.height)) { selPicker.classList.remove("on"); return; }
    place(selPicker, rect, false);
  });

  selPicker.addEventListener("mousedown", function (e) { e.preventDefault(); });
  selPicker.addEventListener("click", function () {
    sendContext(selectionText());
    selPicker.classList.remove("on");
  });

  // Called from the ⌘↩ menu command.
  window.captureSelection = function () {
    if (view === "edit" && cm) {
      var selected = cm.getSelection();
      sendContext(selected && selected.trim() ? selected : blockAroundCursor());
      return;
    }
    var text = selectionText();
    if (text) {
      sendContext(text);
      selPicker.classList.remove("on");
      if (mode !== "normal") setMode("normal");
      return;
    }
    var block = focusPoint && doc.contains(focusPoint.node) ? blockAt(focusPoint) : hoverTarget;
    if (block) { sendContext(blockSource(block)); flash(block); }
  };

  // ===================== vim motions =====================================
  var caretEl = document.getElementById("caret");
  var badge = document.getElementById("badge");
  var searchBar = document.getElementById("searchBar");
  var searchInput = document.getElementById("searchInput");

  var mode = "normal";       // normal | visual | vline
  var focusPoint = null;     // {node, offset} — the cursor
  var anchorPoint = null;    // where visual mode started
  var pendingG = false;
  var programmatic = false;  // true while we write the selection ourselves
  var matches = [];
  var matchIndex = -1;
  var query = "";

  var view = "preview";        // preview | edit
  var cm = null;
  var previewStale = false;
  var bufferTimer = null;

  var jumpLayer = document.getElementById("jumpLayer");
  var jumping = false;
  var jumpQuery = "";
  var jumpTargets = [];
  var vimMode = "normal";
  // Home-row first, and no characters that commonly follow a match.
  var LABELS = "jfkdlshgurnvieowmbcxztpqay";

  function sel() { return window.getSelection(); }

  /** Write the selection without tripping the hover/selection pickers. */
  function mark(fn) {
    programmatic = true;
    fn();
    setTimeout(function () { programmatic = false; }, 0);
  }

  function pointFromSelection() {
    var s = sel();
    if (!s.rangeCount || !s.focusNode) return null;
    return { node: s.focusNode, offset: s.focusOffset };
  }

  function collapseAt(point) {
    var r = document.createRange();
    try { r.setStart(point.node, point.offset); } catch (e) { return; }
    r.collapse(true);
    var s = sel();
    s.removeAllRanges();
    s.addRange(r);
  }

  /** WebKit's Selection.modify does the hard part: word and line granularity. */
  function motion(point, dir, gran) {
    collapseAt(point);
    try { sel().modify("move", dir, gran); } catch (e) { return point; }
    return pointFromSelection() || point;
  }

  function comparePoints(a, b) {
    var ra = document.createRange();
    var rb = document.createRange();
    try {
      ra.setStart(a.node, a.offset);
      rb.setStart(b.node, b.offset);
    } catch (e) { return 0; }
    return ra.compareBoundaryPoints(Range.START_TO_START, rb);
  }

  function walker() {
    return document.createTreeWalker(doc, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        return n.nodeValue && n.nodeValue.trim()
          ? NodeFilter.FILTER_ACCEPT
          : NodeFilter.FILTER_REJECT;
      }
    });
  }

  function firstTextNode() { return walker().nextNode(); }

  function lastTextNode() {
    var w = walker(), last = null, n;
    while ((n = w.nextNode())) last = n;
    return last;
  }

  /** Entering vim from a scrolled position shouldn't yank you to the top. */
  function firstVisibleNode() {
    var w = walker(), n;
    while ((n = w.nextNode())) {
      var r = document.createRange();
      r.selectNodeContents(n);
      var rect = r.getBoundingClientRect();
      if (rect && rect.bottom > 0) return n;
    }
    return firstTextNode();
  }

  function ensureCaret() {
    if (focusPoint && doc.contains(focusPoint.node)) return true;
    var n = firstVisibleNode();
    if (!n) return false;
    focusPoint = { node: n, offset: 0 };
    return true;
  }

  function blockAt(point) {
    var el = point.node.nodeType === 1 ? point.node : point.node.parentElement;
    return el && el.closest ? el.closest("#doc [data-line-start]") : null;
  }

  function rectAt(point) {
    var r = document.createRange();
    try { r.setStart(point.node, point.offset); } catch (e) { return null; }
    r.collapse(true);
    var rect = r.getBoundingClientRect();
    if (rect && (rect.height || rect.width)) return rect;
    var el = point.node.nodeType === 1 ? point.node : point.node.parentElement;
    return el ? el.getBoundingClientRect() : null;
  }

  function drawCaret() {
    if (mode !== "normal" || !focusPoint) { caretEl.style.display = "none"; return; }
    var rect = rectAt(focusPoint);
    if (!rect) { caretEl.style.display = "none"; return; }
    caretEl.style.display = "block";
    caretEl.style.left = (rect.left + window.scrollX) + "px";
    caretEl.style.top = (rect.top + window.scrollY) + "px";
    caretEl.style.height = Math.max(14, rect.height) + "px";
  }

  function revealCaret() {
    if (!focusPoint) return;
    var rect = rectAt(focusPoint);
    if (!rect) return;
    var pad = 60;
    if (rect.top < pad) window.scrollBy(0, rect.top - pad);
    else if (rect.bottom > window.innerHeight - pad) {
      window.scrollBy(0, rect.bottom - window.innerHeight + pad);
    }
  }

  function escHtml(t) {
    return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function updateBadge() {
    var bits = [];
    if (view === "edit") {
      bits.push("<b>" + escHtml(vimMode.toUpperCase()) + "</b>");
      if (bits.length) { badge.innerHTML = bits.join("   "); badge.classList.add("on"); }
      return;
    }
    if (jumping) bits.push("<b>JUMP</b> " + escHtml(jumpQuery));
    if (mode === "visual") bits.push("<b>VISUAL</b>");
    else if (mode === "vline") bits.push("<b>V-LINE</b>");
    if (query) {
      bits.push("/" + escHtml(query) + "  " + (matches.length ? matchIndex + 1 : 0) + "/" + matches.length);
    }
    if (!bits.length) { badge.classList.remove("on"); return; }
    badge.innerHTML = bits.join("   ");
    badge.classList.add("on");
  }

  function applyVisual() {
    if (!anchorPoint || !focusPoint) return;
    var back = comparePoints(anchorPoint, focusPoint) > 0;
    var start = back ? focusPoint : anchorPoint;
    var end = back ? anchorPoint : focusPoint;

    if (mode === "vline") {
      start = motion(start, "backward", "lineboundary");
      end = motion(end, "forward", "lineboundary");
    } else {
      // vim's charwise visual includes the character under the cursor
      var wide = motion(end, "forward", "character");
      if (comparePoints(wide, end) > 0) end = wide;
    }

    var r = document.createRange();
    try {
      r.setStart(start.node, start.offset);
      r.setEnd(end.node, end.offset);
    } catch (e) { return; }
    mark(function () {
      var s = sel();
      s.removeAllRanges();
      s.addRange(r);
    });
  }

  function setMode(next) {
    mode = next;
    if (next === "normal") {
      anchorPoint = null;
      if (focusPoint) mark(function () { collapseAt(focusPoint); });
      selPicker.classList.remove("on");
    }
    drawCaret();
    updateBadge();
  }

  function enterVisual(kind) {
    if (!ensureCaret()) return;
    if (mode === kind) { setMode("normal"); return; }
    anchorPoint = focusPoint;
    mode = kind;
    applyVisual();
    drawCaret();
    updateBadge();
  }

  function settle() {
    if (mode === "normal") mark(function () { collapseAt(focusPoint); });
    else applyVisual();
    revealCaret();
    drawCaret();
  }

  function go(dir, gran) {
    if (!ensureCaret()) return;
    focusPoint = motion(focusPoint, dir, gran);
    settle();
  }

  function gotoTop() {
    var n = firstTextNode();
    if (!n) return;
    focusPoint = { node: n, offset: 0 };
    window.scrollTo(0, 0);
    settle();
  }

  function gotoBottom() {
    var n = lastTextNode();
    if (!n) return;
    focusPoint = { node: n, offset: n.nodeValue.length };
    window.scrollTo(0, document.body.scrollHeight);
    settle();
  }

  // --- editor (CodeMirror 5 + vim keymap) --------------------------------
  function scheduleBufferPost() {
    if (bufferTimer) clearTimeout(bufferTimer);
    bufferTimer = setTimeout(function () {
      bufferTimer = null;
      SRC = cm.getValue();
      LINES = SRC.split("\n");
      previewStale = true;
      post("buffer", SRC);
    }, 250);
  }

  function flushBuffer() {
    if (!cm) return;
    if (bufferTimer) { clearTimeout(bufferTimer); bufferTimer = null; }
    SRC = cm.getValue();
    LINES = SRC.split("\n");
  }

  function ensureEditor() {
    if (cm) return cm;

    cm = CodeMirror(document.getElementById("editor"), {
      value: SRC,
      mode: "markdown",
      keyMap: "vim",
      lineNumbers: true,
      lineWrapping: true,
      indentUnit: 2,
      tabSize: 2,
      viewportMargin: 40
    });

    cm.on("change", scheduleBufferPost);

    // :w and :wq go through the app so the file write stays in Swift.
    CodeMirror.Vim.defineEx("write", "w", function () {
      flushBuffer();
      post("save", SRC);
    });
    CodeMirror.Vim.defineEx("wq", "wq", function () {
      flushBuffer();
      post("save", SRC);
      window.setView("preview");
    });
    CodeMirror.Vim.defineEx("preview", "prev", function () {
      window.setView("preview");
    });

    cm.on("vim-mode-change", function (e) {
      vimMode = e.mode + (e.subMode ? " " + e.subMode : "");
      updateBadge();
    });

    return cm;
  }

  /** The current line plus its contiguous non-blank neighbours. */
  function blockAroundCursor() {
    var line = cm.getCursor().line;
    if (!cm.getLine(line) || !cm.getLine(line).trim()) return cm.getLine(line) || "";
    var top = line, bottom = line;
    while (top > 0 && cm.getLine(top - 1) && cm.getLine(top - 1).trim()) top--;
    while (bottom < cm.lineCount() - 1 && cm.getLine(bottom + 1) && cm.getLine(bottom + 1).trim()) bottom++;
    var out = [];
    for (var i = top; i <= bottom; i++) out.push(cm.getLine(i));
    return out.join("\n");
  }

  window.setView = function (next) {
    if (next === view) return;
    view = next;

    if (view === "edit") {
      ensureEditor();
      if (cm.getValue() !== SRC) cm.setValue(SRC);
      document.body.classList.add("editing");
      hidePickers();
      endJump();
      caretEl.style.display = "none";
      cm.refresh();
      cm.focus();
    } else {
      flushBuffer();
      document.body.classList.remove("editing");
      if (previewStale) renderPreview();
      resetVim();
    }
    updateBadge();
  };

  window.currentBuffer = function () {
    flushBuffer();
    return SRC;
  };

  // --- flash-style jump --------------------------------------------------
  /** Only what's on screen can be labelled, which keeps the label set small. */
  function visibleTextNodes() {
    var w = walker(), n, out = [];
    var h = window.innerHeight;
    while ((n = w.nextNode())) {
      var r = document.createRange();
      r.selectNodeContents(n);
      var rect = r.getBoundingClientRect();
      if (rect.bottom > 0 && rect.top < h) out.push(n);
    }
    return out;
  }

  function findJumpTargets() {
    var out = [];
    if (!jumpQuery) return out;

    var smart = jumpQuery === jumpQuery.toLowerCase();
    var needle = smart ? jumpQuery.toLowerCase() : jumpQuery;
    var h = window.innerHeight;

    visibleTextNodes().forEach(function (node) {
      var hay = smart ? node.nodeValue.toLowerCase() : node.nodeValue;
      var i = hay.indexOf(needle);
      while (i !== -1) {
        var r = document.createRange();
        r.setStart(node, i);
        r.setEnd(node, i + jumpQuery.length);
        var rect = r.getBoundingClientRect();
        if (rect.bottom > 0 && rect.top < h) {
          out.push({
            range: r,
            rect: rect,
            next: hay.charAt(i + jumpQuery.length),
            label: null
          });
        }
        i = hay.indexOf(needle, i + 1);
      }
    });

    // Nearest to the cursor gets the easiest label.
    var origin = focusPoint && doc.contains(focusPoint.node) ? rectAt(focusPoint) : null;
    var oy = origin ? origin.top : 0;
    out.sort(function (a, b) {
      return Math.abs(a.rect.top - oy) - Math.abs(b.rect.top - oy);
    });

    // A label that could also be the next typed character would be ambiguous.
    var blocked = {};
    out.forEach(function (t) { if (t.next) blocked[t.next.toLowerCase()] = true; });
    var pool = LABELS.split("").filter(function (c) { return !blocked[c]; });
    out.forEach(function (t, i) { t.label = i < pool.length ? pool[i] : null; });

    return out;
  }

  function renderJump() {
    jumpLayer.innerHTML = "";
    if (!jumpTargets.length) { jumpLayer.classList.remove("on"); return; }

    jumpTargets.forEach(function (t) {
      var rect = t.range.getBoundingClientRect();

      var hl = document.createElement("div");
      hl.className = "jump-hl";
      hl.style.left = (rect.left + window.scrollX) + "px";
      hl.style.top = (rect.top + window.scrollY) + "px";
      hl.style.width = rect.width + "px";
      hl.style.height = rect.height + "px";
      jumpLayer.appendChild(hl);

      if (!t.label) return;
      var lb = document.createElement("div");
      lb.className = "jump-label";
      lb.textContent = t.label;
      lb.style.left = (rect.right + window.scrollX + 1) + "px";
      lb.style.top = (rect.top + window.scrollY) + "px";
      jumpLayer.appendChild(lb);
    });

    jumpLayer.classList.add("on");
  }

  function refreshJump() {
    jumpTargets = findJumpTargets();
    renderJump();
    updateBadge();
  }

  function startJump() {
    jumping = true;
    jumpQuery = "";
    jumpTargets = [];
    hidePickers();
    renderJump();
    updateBadge();
  }

  function endJump() {
    jumping = false;
    jumpQuery = "";
    jumpTargets = [];
    jumpLayer.innerHTML = "";
    jumpLayer.classList.remove("on");
    updateBadge();
  }

  /** Land on a target: normal mode moves the cursor, visual mode extends. */
  function jumpTo(target) {
    focusPoint = { node: target.range.startContainer, offset: target.range.startOffset };
    endJump();
    settle();
  }

  function handleJumpKey(e) {
    var k = e.key;

    if (k === "Escape") { e.preventDefault(); endJump(); return; }
    if (k === "Backspace") {
      e.preventDefault();
      jumpQuery = jumpQuery.slice(0, -1);
      if (!jumpQuery) { jumpTargets = []; renderJump(); updateBadge(); }
      else refreshJump();
      return;
    }
    if (k === "Enter") {
      e.preventDefault();
      if (jumpTargets.length) jumpTo(jumpTargets[0]);
      return;
    }
    if (k.length !== 1) return;
    e.preventDefault();

    // A label press wins over extending the query.
    for (var i = 0; i < jumpTargets.length; i++) {
      if (jumpTargets[i].label === k) { jumpTo(jumpTargets[i]); return; }
    }

    jumpQuery += k;
    refreshJump();
    if (jumpTargets.length === 1) jumpTo(jumpTargets[0]);   // unambiguous, just go
  }

  // --- search ------------------------------------------------------------
  function runSearch(q) {
    matches = [];
    matchIndex = -1;
    query = q || "";
    if (!query) { updateBadge(); return; }

    var smart = query === query.toLowerCase();   // lowercase query = case-insensitive
    var needle = smart ? query.toLowerCase() : query;
    var w = walker(), n;
    while ((n = w.nextNode())) {
      var hay = smart ? n.nodeValue.toLowerCase() : n.nodeValue;
      var i = hay.indexOf(needle);
      while (i !== -1) {
        var r = document.createRange();
        r.setStart(n, i);
        r.setEnd(n, i + query.length);
        matches.push(r);
        i = hay.indexOf(needle, i + query.length);
      }
    }
    updateBadge();
  }

  function jumpToMatch(i) {
    if (!matches.length) return;
    matchIndex = (i % matches.length + matches.length) % matches.length;
    var r = matches[matchIndex];
    mode = "normal";
    anchorPoint = null;
    mark(function () {
      var s = sel();
      s.removeAllRanges();
      s.addRange(r.cloneRange());
    });
    focusPoint = { node: r.startContainer, offset: r.startOffset };
    revealCaret();
    drawCaret();
    updateBadge();
  }

  function firstMatchAfterCaret() {
    if (!focusPoint) return 0;
    for (var i = 0; i < matches.length; i++) {
      var p = { node: matches[i].startContainer, offset: matches[i].startOffset };
      if (comparePoints(p, focusPoint) > 0) return i;
    }
    return 0;
  }

  function openSearch() {
    searchBar.classList.add("on");
    searchInput.value = "";
    searchInput.focus();
  }

  function closeSearch() {
    searchBar.classList.remove("on");
    searchInput.blur();
  }

  searchInput.addEventListener("keydown", function (e) {
    e.stopPropagation();
    if (e.key === "Enter") {
      e.preventDefault();
      runSearch(searchInput.value);
      closeSearch();
      if (matches.length) jumpToMatch(firstMatchAfterCaret());
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeSearch();
    }
  });

  // --- keymap ------------------------------------------------------------
  var MOTIONS = {
    h: ["backward", "character"],
    l: ["forward", "character"],
    j: ["forward", "line"],
    k: ["backward", "line"],
    w: ["forward", "word"],
    b: ["backward", "word"],
    e: ["forward", "word"],
    "0": ["backward", "lineboundary"],
    "^": ["backward", "lineboundary"],
    $: ["forward", "lineboundary"],
    "{": ["backward", "paragraph"],
    "}": ["forward", "paragraph"]
  };

  document.addEventListener("keydown", function (e) {
    if (view === "edit") return;            // CodeMirror's vim owns the keyboard
    if (document.activeElement === searchInput) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;   // ⌘↩ is handled by the app menu

    if (jumping) { handleJumpKey(e); return; }

    var k = e.key;

    if (k === "g" && !e.shiftKey) {
      if (pendingG) { pendingG = false; e.preventDefault(); gotoTop(); }
      else { pendingG = true; setTimeout(function () { pendingG = false; }, 700); }
      return;
    }
    pendingG = false;

    if (Object.prototype.hasOwnProperty.call(MOTIONS, k)) {
      e.preventDefault();
      go(MOTIONS[k][0], MOTIONS[k][1]);
      return;
    }

    switch (k) {
      case "G": e.preventDefault(); gotoBottom(); return;
      case "s": e.preventDefault(); startJump(); return;
      case "v": e.preventDefault(); enterVisual("visual"); return;
      case "V": e.preventDefault(); enterVisual("vline"); return;
      case "/": e.preventDefault(); openSearch(); return;
      case "n": e.preventDefault(); jumpToMatch(matchIndex + 1); return;
      case "N": e.preventDefault(); jumpToMatch(matchIndex - 1); return;
      case "Escape":
        e.preventDefault();
        if (searchBar.classList.contains("on")) { closeSearch(); return; }
        if (query) { query = ""; matches = []; matchIndex = -1; }
        setMode("normal");
        return;
    }
  });

  // Clicking should move the vim cursor too, so mouse and keyboard agree.
  document.addEventListener("mouseup", function () {
    if (view === "edit") return;
    var p = pointFromSelection();
    if (!p || !doc.contains(p.node)) return;
    focusPoint = p;
    if (sel().isCollapsed) { mode = "normal"; anchorPoint = null; }
    drawCaret();
    updateBadge();
  });

  function resetVim() {
    endJump();
    mode = "normal";
    focusPoint = null;
    anchorPoint = null;
    matches = [];
    matchIndex = -1;
    query = "";
    caretEl.style.display = "none";
    badge.classList.remove("on");
    closeSearch();
  }

  window.addEventListener("scroll", function () {
    hidePickers();
    drawCaret();
    if (jumping) renderJump();
  }, { passive: true });
  window.addEventListener("resize", function () {
    hidePickers();
    drawCaret();
    if (jumping) endJump();   // labels would be stale after a reflow
  });
})();
</script>
</body>
</html>
